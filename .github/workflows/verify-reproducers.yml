name: Verify reproducers

on:
  pull_request:
    paths: ['reproducers/**', '.github/**']
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      php-branch:
        description: 'php-src branch to test (default: all of PHP-8.4, PHP-8.5, PHP-8.6, master)'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      files: ${{ steps.pick.outputs.files }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick reproducers
        id: pick
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # A PR runs only the reproducers it adds or changes, unless it changes the harness itself.
          if [ -n "$BASE_SHA" ] && ! git diff --name-only "$BASE_SHA"...HEAD | grep -q '^\.github/'; then
            files=$(git diff --name-only --diff-filter=AMR "$BASE_SHA"...HEAD -- 'reproducers/*.phpt')
          else
            files=$(git ls-files 'reproducers/*.phpt')
          fi
          echo "files=$(printf '%s' "$files" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          echo "Selected: ${files:-none}"

  verify:
    needs: select
    if: needs.select.outputs.files != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # From the oldest php-src branch still receiving bug fixes; --SKIPIF-- excludes branches per reproducer.
        php-branch: ${{ fromJSON(inputs.php-branch && format('["{0}"]', inputs.php-branch) || '["PHP-8.4", "PHP-8.5", "PHP-8.6", "master"]') }}
    env:
      PHP_BRANCH: ${{ matrix.php-branch }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve php-src commit
        id: src
        run: |
          sha=$(git ls-remote --exit-code https://github.com/php/php-src "refs/heads/$PHP_BRANCH" | cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "php-src $PHP_BRANCH @ $sha"

      - name: Restore PHP build
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/php
          key: php-debug-${{ steps.src.outputs.sha }}-${{ hashFiles('.github/scripts/build-php.sh') }}

      - name: Install build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends autoconf bison re2c pkg-config

      - name: Checkout php-src
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: php/php-src
          ref: ${{ steps.src.outputs.sha }}
          path: php-src

      - name: Build PHP
        if: steps.cache.outputs.cache-hit != 'true'
        run: .github/scripts/build-php.sh php-src ~/php

      - name: Verify reproducers
        env:
          FILES: ${{ needs.select.outputs.files }}
        run: |
          ~/php/bin/php -v
          echo "php-src \`$PHP_BRANCH\` @ ${{ steps.src.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          read -ra files <<< "$FILES"
          python3 .github/scripts/verify-reproducers.py --php ~/php/bin/php "${files[@]}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verify-reproducers-${{ matrix.php-branch }}
          path: verify-out
          if-no-files-found: ignore
